<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>CV Generator</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        border: 1px solid #ddd;
        padding: 8px;
        vertical-align: top;
      }
      .cv-controls {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      .cv-controls button {
        padding: 8px 16px;
        cursor: pointer;
      }
      .cv-preview {
        width: 100%;
        height: 80vh;
        border: 1px solid #ddd;
      }
      @media print {
        body > *:not(#app) {
          display: none !important;
        }
        .cv-controls {
          display: none !important;
        }
        .cv-preview {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: none;
        }
      }
    </style>
  </head>
  <body>
    <button id="start">Start</button>
    <div id="status"></div>
    <div id="app" class="grid"></div>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
